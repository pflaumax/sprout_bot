[project]
name = "sprout"
version = "0.1.0"
description = "A Bluesky bot whose one post grows into a tree as people like, repost and reply to it."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
